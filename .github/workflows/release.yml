name: Build

on:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: arara-ide/arara-code
          ref: ${{ github.ref_name }}
          path: .sources/arara-code
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm test
        env:
          ARARA_CODE_SOURCE: .sources/arara-code
      - run: npm run build
        env:
          ARARA_CODE_SOURCE: .sources/arara-code

  version:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          base="$(node -p 'require("./package.json").version.split(".").slice(0,2).join(".")')"
          patch=$(( 10000 + (10#$(date -u +%j) - 1) * 24 + 10#$(date -u +%H) ))
          echo "value=${base}.${patch}" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    uses: ./.github/workflows/build-platform.yml
    with:
      version: ${{ needs.version.outputs.value }}
      platform: linux
      runner: ubuntu-latest
    secrets: inherit

  windows:
    needs: version
    uses: ./.github/workflows/build-platform.yml
    with:
      version: ${{ needs.version.outputs.value }}
      platform: windows
      runner: windows-latest
    secrets: inherit

  macos-x64:
    needs: version
    uses: ./.github/workflows/build-platform.yml
    with:
      version: ${{ needs.version.outputs.value }}
      platform: macos-x64
      runner: macos-15-intel
      arch: x64
    secrets: inherit

  macos-arm64:
    needs: version
    uses: ./.github/workflows/build-platform.yml
    with:
      version: ${{ needs.version.outputs.value }}
      platform: macos-arm64
      runner: macos-15
      arch: arm64
    secrets: inherit

  release-linux:
    if: github.ref == 'refs/heads/main'
    needs: [version, linux]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.version.outputs.value }}
      artifact: linux

  release-windows:
    if: github.ref == 'refs/heads/main'
    needs: [version, windows]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.version.outputs.value }}
      artifact: windows

  release-macos-x64:
    if: github.ref == 'refs/heads/main'
    needs: [version, macos-x64]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.version.outputs.value }}
      artifact: macos-x64

  release-macos-arm64:
    if: github.ref == 'refs/heads/main'
    needs: [version, macos-arm64]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.version.outputs.value }}
      artifact: macos-arm64
