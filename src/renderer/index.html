<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arara Vibes</title><link rel="icon" href="logo.svg"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="shell.css"><script src="renderer.js" defer></script></head>
<body><main id="vibes">
<header id="titlebar"><div class="brand"><img id="brand-logo" src="logo.svg" alt="" width="18" height="18"></div><div id="tab-strip" hidden><div id="tabs" role="tablist" data-label="Open tabs"></div><details id="tab-picker" class="picker"><summary class="icon-btn" data-label="New tab"><svg aria-hidden="true"><use href="icons.svg#add"></use></svg></summary><div class="picker-panel glass-menu"><div class="picker-heading" data-text="New tab"></div><div id="platform-options" class="option-list" role="menu"></div></div></details></div><div class="window-actions"><button id="updates-open" class="icon-btn" data-label="Updates"><svg aria-hidden="true"><use href="icons.svg#sync"></use></svg></button><button id="history" class="icon-btn" data-label="History"><svg aria-hidden="true"><use href="icons.svg#history"></use></svg></button><button id="expand" class="icon-btn" data-label="Collapse" aria-expanded="true"><svg aria-hidden="true"><use href="icons.svg#chevron-up"></use></svg></button><button id="hide" class="icon-btn" data-label="Hide"><svg aria-hidden="true"><use href="icons.svg#close"></use></svg></button></div></header>
<section id="content"><div id="stage"><section id="loading" role="status"><img id="loading-logo" src="logo-animated.svg" alt="" width="96" height="96"></section><section id="recover" hidden><img src="logo.svg" alt="" width="48" height="48"><h1 data-text="Arara did not start"></h1><p data-text="Arara Code did not answer. Try again to restart it."></p><button id="retry" class="primary" data-text="Try again"></button></section><section id="onboarding" hidden><img src="logo.svg" alt="" width="48" height="48"><h1 data-text="Welcome to Arara Vibes"></h1><p data-text="Choose how Arara Vibes starts. You can change this later in Settings › General."></p><div class="onboarding-options"><label class="check"><input type="checkbox" id="onboarding-login"><span data-text="Start with the system"></span></label><label class="check"><input type="checkbox" id="onboarding-bar"><span id="onboarding-bar-label"></span></label></div><button id="onboarding-continue" class="primary" data-text="Continue"></button></section><section id="update" hidden role="dialog" aria-modal="true" aria-labelledby="update-title"><img src="logo.svg" alt="" width="48" height="48"><h1 id="update-title" data-text="Updates"></h1><p id="update-text" role="status" aria-live="polite"></p><div id="update-products"></div><div class="update-actions"><button id="update-install" class="primary" data-text="Update all"></button><button id="update-check" class="soft-btn" data-text="Check for updates"></button><button id="update-close" class="soft-btn" data-text="Later"></button></div></section><section id="signin" hidden><img src="logo.svg" alt="" width="48" height="48"><h1 data-text="Sign in to Arara"></h1><p data-text="Use the same account as Arara Code."></p><div class="signin-actions"><button id="sign-in" class="primary" data-text="Sign in"></button><button id="sign-in-copy" class="soft-btn" data-text="Copy link" data-label="Copy sign-in link"></button></div></section><section id="history-panel" class="glass-menu" hidden><button id="history-new" class="soft-btn"><svg aria-hidden="true"><use href="icons.svg#clear-all"></use></svg><span data-text="New chat"></span></button><h2 data-text="History"></h2><div id="conversations"></div></section></div><footer id="feedback" role="status" hidden></footer></section></main></body></html>
